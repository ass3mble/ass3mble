<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Ariyana futuristic editorial header</title>
  <desc id="desc">Animated neon editorial cover for Ariyana's GitHub profile</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070c"/>
      <stop offset="46%" stop-color="#0d0b18"/>
      <stop offset="100%" stop-color="#080b15"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4fd8"/>
      <stop offset="48%" stop-color="#a56cff"/>
      <stop offset="100%" stop-color="#2df4ff"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="18%" stop-color="#77f9ff" stop-opacity="0.85"/>
      <stop offset="58%" stop-color="#b44cff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.65" fill="#ffffff" opacity="0.05"/>
      <circle cx="5" cy="4" r="0.55" fill="#ffffff" opacity="0.03"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: Inter, Arial, Helvetica, sans-serif; }
      .micro { font-size: 15px; letter-spacing: 4px; fill: #b9b7c9; }
      .tiny { font-size: 13px; letter-spacing: 2.5px; fill: #858397; }
      .headline { font-size: 126px; font-weight: 700; letter-spacing: -5px; fill: #f8f7ff; }
      .italic { font-size: 31px; font-style: italic; fill: #d8d5e8; }
      .pulse { animation: pulse 4.8s ease-in-out infinite; transform-origin: 1110px 165px; }
      .ticker { animation: ticker 16s linear infinite; }
      .slide { animation: slide 7s ease-in-out infinite; }
      .blink { animation: blink 2.2s steps(1) infinite; }
      @keyframes pulse { 0%,100%{transform:scale(.92);opacity:.58} 50%{transform:scale(1.08);opacity:1} }
      @keyframes ticker { 0%{transform:translateX(0)} 100%{transform:translateX(-430px)} }
      @keyframes slide { 0%,100%{transform:translateX(0)} 50%{transform:translateX(34px)} }
      @keyframes blink { 0%,72%{opacity:1} 73%,100%{opacity:.15} }
    </style>
  </defs>

  <rect width="1400" height="560" fill="url(#bg)"/>
  <rect width="1400" height="560" fill="url(#grain)"/>

  <rect x="42" y="38" width="1316" height="484" rx="2" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <line x1="68" y1="94" x2="1332" y2="94" stroke="#ffffff" stroke-opacity="0.16"/>
  <line x1="980" y1="112" x2="980" y2="476" stroke="#ffffff" stroke-opacity="0.11"/>

  <text x="70" y="75" class="mono micro">ARIYANA / DIGITAL EDITION</text>
  <text x="1045" y="75" class="mono micro">ISSUE 001 / 2026</text>

  <g class="pulse">
    <circle cx="1110" cy="165" r="128" fill="url(#orb)" opacity="0.45"/>
    <circle cx="1110" cy="165" r="56" fill="none" stroke="url(#neon)" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="1110" cy="165" r="38" fill="#080914" stroke="#ffffff" stroke-opacity="0.15"/>
  </g>

  <rect x="68" y="138" width="182" height="8" fill="#ff4fd8"/>
  <rect x="258" y="138" width="74" height="8" fill="#a56cff"/>
  <rect x="340" y="138" width="126" height="8" fill="#2df4ff"/>

  <text x="66" y="286" class="serif headline">ARIYANA</text>
  <text x="73" y="336" class="serif italic">stories with signal. systems with taste.</text>

  <g class="slide">
    <rect x="72" y="382" width="432" height="48" fill="#f8f7ff"/>
    <text x="92" y="413" class="mono" font-size="16" letter-spacing="2.2" fill="#090910">CONTENT / CULTURE / CREATIVE SYSTEMS</text>
  </g>

  <text x="1025" y="306" class="mono tiny">MAKE IT CLEAR</text>
  <text x="1025" y="338" class="mono tiny">MAKE IT FELT</text>
  <text x="1025" y="370" class="mono tiny">MAKE IT USEFUL</text>
  <text x="1025" y="424" class="mono tiny">STATUS / CURIOUS <tspan class="blink" fill="#2df4ff">●</tspan></text>

  <line x1="68" y1="468" x2="1332" y2="468" stroke="url(#neon)" stroke-width="2" opacity="0.85"/>
  <clipPath id="tickerClip"><rect x="68" y="480" width="1264" height="34"/></clipPath>
  <g clip-path="url(#tickerClip)">
    <g class="ticker">
      <text x="70" y="505" class="mono tiny" fill="#c9c6d7">WORDS FOR HUMANS  •  SYSTEMS FOR SCALE  •  GOOD IDEAS DESERVE GOOD EXECUTION  •  WORDS FOR HUMANS  •  SYSTEMS FOR SCALE  •  GOOD IDEAS DESERVE GOOD EXECUTION  •</text>
    </g>
  </g>
</svg>
