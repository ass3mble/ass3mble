<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 120" role="img" aria-labelledby="title desc">
  <title id="title">Ariyana neon footer</title>
  <desc id="desc">Animated neon editorial footer strip</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4fd8"/>
      <stop offset="32%" stop-color="#a56cff"/>
      <stop offset="68%" stop-color="#2df4ff"/>
      <stop offset="100%" stop-color="#68ffb3"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .line { animation: move 5s ease-in-out infinite; }
      .text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; letter-spacing: 4px; fill: #d8d5e8; }
      @keyframes move { 0%,100%{transform:scaleX(.82);opacity:.55} 50%{transform:scaleX(1);opacity:1} }
    </style>
  </defs>
  <rect width="1400" height="120" fill="#08090f" rx="20"/>
  <g class="line" style="transform-origin:700px 46px">
    <rect x="115" y="43" width="1170" height="4" rx="2" fill="url(#g)" filter="url(#glow)"/>
  </g>
  <text x="700" y="88" text-anchor="middle" class="text">WORDS FOR HUMANS  /  SYSTEMS FOR SCALE</text>
</svg>