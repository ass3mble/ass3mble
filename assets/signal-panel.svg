<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 280" role="img" aria-labelledby="title desc">
  <title id="title">Ariyana signal panel</title>
  <desc id="desc">Animated futuristic editorial panel with neon gradients</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070c"/>
      <stop offset="50%" stop-color="#120a1a"/>
      <stop offset="100%" stop-color="#07141a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4fd8"/>
      <stop offset="45%" stop-color="#a56cff"/>
      <stop offset="100%" stop-color="#2df4ff"/>
    </linearGradient>
    <radialGradient id="pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4fd8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2df4ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2df4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, Arial, Helvetica, sans-serif; }
      .title { font-size: 44px; font-weight: 700; letter-spacing: 2px; fill: #f8f7ff; }
      .micro { font-size: 14px; letter-spacing: 3px; fill: #bdb8ca; }
      .tag { font-size: 18px; letter-spacing: 3px; fill: #e7e5f0; }
      .flow { animation: flow 7s ease-in-out infinite; }
      .pulse { animation: pulse 5s ease-in-out infinite; }
      .scan { animation: scan 6s linear infinite; }
      @keyframes flow { 0%,100%{transform:translateX(-80px)} 50%{transform:translateX(80px)} }
      @keyframes pulse { 0%,100%{opacity:.35;transform:scale(.9)} 50%{opacity:.8;transform:scale(1.1)} }
      @keyframes scan { 0%{transform:translateX(-1400px)} 100%{transform:translateX(1400px)} }
    </style>
  </defs>

  <rect width="1400" height="280" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1398" height="278" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g class="pulse">
    <circle cx="270" cy="130" r="210" fill="url(#pink)" filter="url(#blur)"/>
    <circle cx="1130" cy="150" r="220" fill="url(#cyan)" filter="url(#blur)"/>
  </g>

  <g class="flow" opacity="0.55">
    <rect x="280" y="82" width="840" height="2" fill="url(#line)"/>
    <rect x="380" y="198" width="640" height="2" fill="url(#line)"/>
  </g>

  <text x="78" y="78" class="mono micro">CURRENT FREQUENCY</text>
  <text x="78" y="146" class="sans title">CONTENT / CULTURE / SYSTEMS</text>
  <text x="80" y="192" class="mono tag">strategy  ·  storytelling  ·  automation  ·  vibe code</text>
  <text x="80" y="232" class="mono micro">MAKE IT CLEAR  /  MAKE IT FELT  /  KEEP IT HUMAN</text>

  <g class="scan" opacity="0.22">
    <rect x="-260" y="0" width="220" height="280" fill="url(#line)" transform="skewX(-18)"/>
  </g>
</svg>