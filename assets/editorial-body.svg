<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Ariyana editorial profile canvas</title>
  <desc id="desc">Animated futuristic editorial panels for Ariyana's GitHub profile</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070c"/>
      <stop offset="45%" stop-color="#0d0b18"/>
      <stop offset="100%" stop-color="#07131a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4fd8"/>
      <stop offset="45%" stop-color="#a56cff"/>
      <stop offset="100%" stop-color="#2df4ff"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2df4ff"/>
      <stop offset="100%" stop-color="#68ffb3"/>
    </linearGradient>
    <radialGradient id="pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4fd8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2df4ff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#2df4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.55" fill="#fff" opacity="0.045"/>
      <circle cx="6" cy="4" r="0.45" fill="#fff" opacity="0.025"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="48"/></filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, Arial, Helvetica, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .kicker { font-size: 14px; letter-spacing: 4px; fill: #a6a2b6; }
      .h { font-size: 48px; font-weight: 700; fill: #f8f7ff; letter-spacing: -1px; }
      .copy { font-size: 22px; fill: #d7d3e4; }
      .small { font-size: 15px; fill: #a8a3b8; letter-spacing: 1.4px; }
      .pill { font-size: 16px; fill: #f8f7ff; letter-spacing: 1.5px; }
      .pulse { animation: pulse 5.6s ease-in-out infinite; }
      .drift { animation: drift 10s ease-in-out infinite; }
      .scan { animation: scan 7s linear infinite; }
      .blink { animation: blink 2s steps(1) infinite; }
      @keyframes pulse { 0%,100%{opacity:.34;transform:scale(.92)} 50%{opacity:.78;transform:scale(1.08)} }
      @keyframes drift { 0%,100%{transform:translateX(-28px)} 50%{transform:translateX(34px)} }
      @keyframes scan { 0%{transform:translateX(-1650px)} 100%{transform:translateX(1650px)} }
      @keyframes blink { 0%,70%{opacity:1} 71%,100%{opacity:.15} }
    </style>
  </defs>

  <rect width="1400" height="980" rx="34" fill="url(#bg)"/>
  <rect width="1400" height="980" rx="34" fill="url(#grid)"/>
  <rect width="1400" height="980" rx="34" fill="url(#grain)"/>
  <rect x="1" y="1" width="1398" height="978" rx="33" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g class="pulse">
    <circle cx="180" cy="180" r="260" fill="url(#pink)" filter="url(#blur)"/>
    <circle cx="1230" cy="440" r="300" fill="url(#cyan)" filter="url(#blur)"/>
    <circle cx="920" cy="850" r="240" fill="url(#pink)" filter="url(#blur)" opacity="0.55"/>
  </g>

  <g opacity="0.08">
    <path d="M1020 0L720 980" stroke="#fff" stroke-width="1"/>
    <path d="M1140 0L840 980" stroke="#fff" stroke-width="1"/>
    <path d="M1260 0L960 980" stroke="#fff" stroke-width="1"/>
  </g>

  <g>
    <rect x="58" y="54" width="1284" height="250" rx="28" fill="#0c0b14" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="58" y="54" width="8" height="250" rx="4" fill="url(#neon)"/>
    <text x="94" y="98" class="mono kicker">PROFILE</text>
    <text x="94" y="164" class="serif h">Content marketer with a builder streak.</text>
    <text x="94" y="212" class="sans copy">Clear ideas. Good writing. Strong taste.</text>
    <text x="94" y="250" class="sans copy">Small systems when repetition gets annoying.</text>
    <text x="1115" y="102" class="mono small">STATUS / CURIOUS <tspan class="blink" fill="#68ffb3">●</tspan></text>
    <g class="drift" opacity="0.9">
      <rect x="1030" y="176" width="210" height="3" rx="2" fill="url(#neon)" filter="url(#glow)"/>
      <rect x="1094" y="198" width="146" height="3" rx="2" fill="url(#mint)"/>
    </g>
  </g>

  <g>
    <rect x="58" y="330" width="1284" height="300" rx="28" fill="#0b0d16" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="94" y="378" class="mono kicker">NOW</text>
    <text x="94" y="438" class="serif h">What has my attention</text>

    <g>
      <rect x="94" y="478" width="210" height="48" rx="24" fill="#ff4fd8" fill-opacity="0.12" stroke="#ff4fd8" stroke-opacity="0.45"/>
      <text x="199" y="508" text-anchor="middle" class="mono pill">CONTENT STRATEGY</text>
      <rect x="322" y="478" width="170" height="48" rx="24" fill="#2df4ff" fill-opacity="0.1" stroke="#2df4ff" stroke-opacity="0.42"/>
      <text x="407" y="508" text-anchor="middle" class="mono pill">STORYTELLING</text>
      <rect x="510" y="478" width="164" height="48" rx="24" fill="#a56cff" fill-opacity="0.11" stroke="#a56cff" stroke-opacity="0.42"/>
      <text x="592" y="508" text-anchor="middle" class="mono pill">AUTOMATION</text>
      <rect x="692" y="478" width="148" height="48" rx="24" fill="#68ffb3" fill-opacity="0.1" stroke="#68ffb3" stroke-opacity="0.4"/>
      <text x="766" y="508" text-anchor="middle" class="mono pill">VIBE CODE</text>
      <rect x="858" y="478" width="214" height="48" rx="24" fill="#ff9f43" fill-opacity="0.1" stroke="#ff9f43" stroke-opacity="0.4"/>
      <text x="965" y="508" text-anchor="middle" class="mono pill">INTERNET CULTURE</text>
    </g>

    <text x="94" y="574" class="sans copy">I build small things, test ideas, and keep what earns its place.</text>

    <g class="scan" opacity="0.2">
      <rect x="-280" y="330" width="230" height="300" fill="url(#neon)" transform="skewX(-18)"/>
    </g>
  </g>

  <g>
    <rect x="58" y="656" width="1284" height="264" rx="28" fill="#0c0b14" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="94" y="704" class="mono kicker">THIS SPACE</text>
    <text x="94" y="764" class="serif h">Part notebook. Part playground.</text>
    <text x="94" y="812" class="sans copy">Experiments, workflow ideas, scraps, and tiny tools.</text>
    <text x="94" y="850" class="sans copy">Curiosity usually turns into a project eventually.</text>

    <g opacity="0.78">
      <circle cx="1110" cy="770" r="64" fill="none" stroke="url(#neon)" stroke-width="2"/>
      <circle cx="1110" cy="770" r="42" fill="#0a0b12" stroke="#ffffff" stroke-opacity="0.1"/>
      <circle cx="1110" cy="770" r="12" fill="#2df4ff" filter="url(#glow)"/>
      <path d="M1052 846H1168" stroke="url(#mint)" stroke-width="3"/>
    </g>
  </g>
</svg>